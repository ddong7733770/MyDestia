<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>지금 이 순간 수호천사</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Pretendard:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #0f172a; color: white; overflow-x: hidden; scroll-behavior: smooth; }
        .font-destiny { font-family: 'Noto Serif KR', serif; }
        
        /* 아날로그 시계 */
        .clock-face { width: 110px; height: 110px; border-radius: 50%; border: 3px solid #fbbf24; position: relative; background: radial-gradient(circle, #1e293b 0%, #0f172a 100%); box-shadow: 0 0 15px rgba(251, 191, 36, 0.3); margin: 0 auto; }
        .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom; background: white; border-radius: 2px; transform: translateX(-50%); transition: transform 0.05s cubic-bezier(0.4, 2.08, 0.55, 0.44); }
        .hour-hand { width: 3px; height: 27px; background: #cbd5e1; }
        .min-hand { width: 2px; height: 40px; background: #f8fafc; }
        .sec-hand { width: 1px; height: 47px; background: #ef4444; }
        .clock-center { position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; background: #fbbf24; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 5px rgba(0,0,0,0.5); }
        
        .mode-btn { transition: all 0.3s ease; }
        .mode-btn.active { border-color: #fbbf24; background-color: rgba(251, 191, 36, 0.1); box-shadow: 0 0 15px rgba(251, 191, 36, 0.4); transform: translateY(-2px); }

        /* 이펙트 오버레이 */
        .screen-shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both infinite; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-4px, 0, 0) rotate(-1deg); }
            20%, 80% { transform: translate3d(4px, 0, 0) rotate(1deg); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0) rotate(-2deg); }
            40%, 60% { transform: translate3d(8px, 0, 0) rotate(2deg); }
        }

        .lightning-overlay { position: fixed; inset: 0; background: #fff; z-index: 45; opacity: 0; pointer-events: none; mix-blend-mode: overlay; }
        .lightning-active { animation: lightningStrike 2s ease-out forwards; }
        @keyframes lightningStrike { 0%{opacity:0;} 10%{opacity:1;} 20%{opacity:0;} 30%{opacity:0.9;} 40%{opacity:0;} 70%{opacity:0;} 75%{opacity:1;} 80%{opacity:0;} 100%{opacity:0;} }

        /* 먹구름 이펙트 */
        .fog-overlay { position: fixed; inset: 0; z-index: 40; opacity: 0; pointer-events: none; background: radial-gradient(circle, rgba(30,41,59,0.9) 0%, rgba(0,0,0,0.95) 100%); filter: blur(10px); transition: opacity 0.5s; }
        .fog-active { opacity: 1; }

        /* 광명(해돋이) 이펙트 */
        .sunrise-overlay { position: fixed; inset: 0; z-index: 42; opacity: 0; pointer-events: none; background: radial-gradient(circle at center, rgba(253,224,71,0.8) 0%, rgba(245,158,11,0.5) 40%, transparent 80%); mix-blend-mode: screen; transition: opacity 1.5s ease-in-out; }
        .sunrise-active { opacity: 1; transform: scale(1.2); }

        .white-flash { position: fixed; inset: 0; background: white; z-index: 60; opacity: 0; pointer-events: none; }
        .flash-active { animation: flashBang 1.5s ease-out forwards; }
        @keyframes flashBang { 0% { opacity: 1; } 100% { opacity: 0; } }

        /* 카드 애니메이션 & 디자인 */
        .perspective { perspective: 1500px; }
        .card-inner { position: relative; width: 100%; height: 100%; text-align: center; transform-style: preserve-3d; transition: transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform: scale(0.3) translateY(200px); opacity: 0; }
        .card-show { transform: scale(1) translateY(0); opacity: 1; }
        
        /* 고속 회전 애니메이션 */
        .spinning-card { animation: fastSpin 0.3s linear infinite; }
        @keyframes fastSpin { 0% { transform: scale(1.1) rotateY(0deg); } 100% { transform: scale(1.1) rotateY(360deg); } }
        
        .card-inner.is-flipped { transform: scale(1) translateY(0) rotateY(180deg); }
        
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); border-width: 4px; border-style: solid;}
        
        /* 화려한 타로+트럼프 카드 뒷면 디자인 */
        .card-front { 
            background: 
                linear-gradient(135deg, rgba(251,191,36,0.1) 25%, transparent 25%) -25px 0,
                linear-gradient(225deg, rgba(251,191,36,0.1) 25%, transparent 25%) -25px 0,
                linear-gradient(315deg, rgba(251,191,36,0.1) 25%, transparent 25%),
                linear-gradient(45deg, rgba(251,191,36,0.1) 25%, transparent 25%);
            background-size: 50px 50px;
            background-color: #0f172a;
            border: 8px double #fbbf24;
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
        }
        .card-front::after {
            content: ''; position: absolute; inset: 10px; border: 1px solid rgba(251,191,36,0.5); border-radius: 10px;
        }

        .card-back { transform: rotateY(180deg); background-color: #0f172a; overflow: hidden; }
        
        /* 그림자 일러스트 전용 필터 */
        .silhouette-img { filter: brightness(0) drop-shadow(0 0 10px rgba(255,255,255,0.2)); opacity: 0.8; }
        
        .bg-glow { position: absolute; width: 100%; height: 100%; background: radial-gradient(circle, rgba(251,191,36,0.15) 0%, rgba(0,0,0,0) 60%); top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: -1; }
        .star-item { transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    </style>
</head>
<body class="min-h-screen flex flex-col relative">

    <div id="fogOverlay" class="fog-overlay"></div>
    <div id="lightningOverlay" class="lightning-overlay"></div>
    <div id="sunriseOverlay" class="sunrise-overlay"></div>
    <div id="whiteFlash" class="white-flash"></div>
    
    <input type="file" id="faceInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">

    <!-- 1. 메인 화면 -->
    <div id="mainScreen" class="flex-1 flex flex-col items-center justify-center p-6 relative z-10 transition-opacity duration-500">
        <div class="bg-glow"></div>
        <h2 class="text-gray-400 text-sm mb-4 tracking-widest font-semibold">나의 수호천사가 알려주는</h2>
        <h1 class="text-[34px] font-destiny font-black text-white mb-10 text-center leading-tight drop-shadow-lg tracking-tight">
            지금 이 순간<br><span class="text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-600">내 운세</span>
        </h1>
        
        <div class="clock-face mb-6">
            <div id="hourHand" class="hand hour-hand"></div>
            <div id="minHand" class="hand min-hand"></div>
            <div id="secHand" class="hand sec-hand"></div>
            <div class="clock-center"></div>
        </div>

        <div id="digitalClock" class="text-2xl font-mono text-yellow-400 font-bold tracking-widest mb-10 drop-shadow-[0_0_10px_rgba(251,191,36,0.5)]">00:00:00:00</div>

        <div class="flex gap-4 mb-10 w-full max-w-sm">
            <button id="btnFortune" onclick="selectMode('fortune')" class="mode-btn flex-1 bg-gray-800/80 backdrop-blur text-gray-300 py-4 rounded-xl border-2 border-gray-700">
                <i class="fa-solid fa-star-and-crescent mb-2 text-xl block"></i>
                <span class="text-sm">지금 이 순간</span><br><span class="font-bold text-white text-lg">운세 알아보기</span>
            </button>
            <button id="btnFace" onclick="triggerFaceScan()" class="mode-btn flex-1 bg-gray-800/80 backdrop-blur text-gray-300 py-4 rounded-xl border-2 border-gray-700">
                <i class="fa-solid fa-camera mb-2 text-xl block"></i>
                <span class="text-sm">지금 이 순간</span><br><span class="font-bold text-white text-lg">관상 알아보기</span>
            </button>
        </div>

        <button id="btnSummon" onclick="startSummoning()" disabled class="w-full max-w-sm bg-gradient-to-r from-yellow-600 to-yellow-400 text-gray-900 font-black py-5 rounded-2xl shadow-[0_0_15px_rgba(251,191,36,0.2)] transition-all transform opacity-40 cursor-not-allowed">
            <div class="text-sm opacity-90 mb-1">모드를 먼저 선택해주세요</div>
            <div class="text-2xl animate-pulse font-destiny">나의 수호천사 소환</div>
        </button>
    </div>

    <!-- 2. 결과 화면 -->
    <div id="resultScreen" class="hidden flex-1 flex-col items-center p-6 relative z-10 pb-20 overflow-y-auto w-full max-w-2xl mx-auto">
        <div id="resultBgGlow" class="absolute top-0 left-0 w-full h-[600px] opacity-20 blur-3xl z-0 transition-colors duration-1000"></div>

        <div class="perspective w-72 h-[420px] mx-auto mt-2 mb-8 z-20 shrink-0">
            <div id="cardInner" class="card-inner">
                <!-- 타로/트럼프 스타일 뒷면 -->
                <div id="cardFront" class="card-front">
                    <div class="w-24 h-24 border-2 border-yellow-400 rounded-full flex items-center justify-center mb-4 z-10 bg-gray-900">
                        <i class="fa-solid fa-eye text-4xl text-yellow-500"></i>
                    </div>
                </div>
                <!-- 카드 앞면 (그림자 일러스트) -->
                <div id="cardBack" class="card-back group bg-gradient-to-b from-gray-800 to-gray-900 flex flex-col justify-end">
                    <img id="cardImage" src="" class="w-full h-[80%] object-contain silhouette-img group-hover:scale-105 transition-transform duration-[2000ms] mb-4">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/95 via-black/40 to-transparent"></div>
                    <div class="absolute bottom-6 left-0 w-full text-center px-4">
                        <span id="rankBadge" class="text-black text-xs font-black px-4 py-1.5 rounded-full mb-3 inline-block shadow-lg">등급</span>
                        <h3 id="cardName" class="text-4xl font-black text-white font-destiny drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)] tracking-tight">이름</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- 숨겨져 있다가 카드 오픈 후 나타나는 컨텐츠 영역 -->
        <div id="resultContent" class="w-full opacity-0 transition-opacity duration-1000">
            <div class="w-full bg-gray-800/90 rounded-3xl px-4 py-8 border border-gray-700 backdrop-blur-md shadow-2xl relative mb-8">
                <div class="mb-8 relative">
                    <i class="fa-solid fa-quote-left text-3xl opacity-20 absolute -top-4 -left-1" id="quoteIcon"></i>
                    <p id="fortuneMessage" class="text-base text-gray-100 font-destiny leading-relaxed break-keep relative z-10 pl-6 mt-2 font-medium">
                        통합된 운세 메시지가 출력됩니다.
                    </p>
                </div>

                <div id="statsContainer" class="bg-gray-900/80 rounded-2xl p-5 mb-6 border border-gray-700/50 transform transition-all duration-500 opacity-0 translate-y-10">
                    <div class="flex justify-between items-end mb-4">
                        <div>
                            <span class="text-gray-400 text-xs font-bold tracking-widest block mb-1">지금 행운 점수</span>
                            <span id="fortuneScore" class="text-6xl font-black leading-none">0</span><span class="text-gray-500 font-bold ml-1">점</span>
                        </div>
                        <div class="text-right pb-1">
                            <span class="text-gray-400 text-xs font-bold tracking-widest block mb-2">기세 레벨</span>
                            <div id="starContainer" class="text-sm flex gap-1 justify-end flex-wrap w-24"></div>
                        </div>
                    </div>
                    
                    <!-- 음양오행 사주 풀이 영역 추가 -->
                    <div id="sajuSection" class="mt-4 pt-4 border-t border-gray-700">
                        <div class="flex items-center gap-2 mb-2">
                            <span id="sajuElementBadge" class="text-xs font-black px-2 py-1 rounded-md"></span>
                            <span class="text-sm font-bold text-gray-300">현재 음양오행 기운 판독</span>
                        </div>
                        <p id="sajuMessage" class="text-[14px] text-gray-400 leading-snug break-keep"></p>
                    </div>
                    
                    <p id="actionMessage" class="mt-5 text-[15px] font-bold text-white bg-black/60 p-4 rounded-xl break-keep text-center shadow-inner border border-gray-700">지령 메시지</p>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div id="luckyColorBox" class="p-4 rounded-2xl border border-gray-700 flex flex-col justify-between shadow-inner h-24">
                        <span class="text-[11px] font-bold text-white/80 drop-shadow-md"><i class="fa-solid fa-palette mr-1"></i> 행운의 컬러</span>
                        <strong id="luckyColor" class="text-white text-base drop-shadow-md self-end">컬러</strong>
                    </div>
                    <div class="bg-gray-900 p-4 rounded-2xl border border-gray-700 flex items-center justify-between h-24 relative overflow-hidden">
                        <div class="z-10 flex flex-col h-full justify-between w-full">
                            <span class="text-[11px] font-bold text-gray-400"><i class="fa-solid fa-utensils mr-1"></i> 추천 메뉴</span>
                            <strong id="luckyCafe" class="text-white text-sm font-bold mt-auto max-w-[70px] break-keep leading-tight">메뉴</strong>
                        </div>
                        <img id="luckyCafeImg" src="" class="absolute -right-3 -bottom-3 w-20 h-20 object-cover rounded-full border-4 border-gray-800 shadow-xl opacity-90">
                    </div>
                    <div class="bg-gray-900 p-4 rounded-2xl border border-gray-700 h-24 flex flex-col justify-between">
                        <span class="text-[11px] font-bold text-gray-400"><i class="fa-solid fa-clover mr-1"></i> 행운의 숫자</span>
                        <strong id="luckyNum" class="text-3xl font-black self-end">000</strong>
                    </div>
                    <div class="bg-gray-900 p-4 rounded-2xl border border-gray-700 h-24 flex flex-col justify-between">
                        <span class="text-[11px] font-bold text-gray-400"><i class="fa-solid fa-pen mr-1"></i> 행운의 도구</span>
                        <strong id="luckyTool" class="text-white text-base font-bold self-end text-right">도구</strong>
                    </div>
                    <div class="bg-gray-900 p-4 rounded-2xl border border-gray-700 h-24 flex flex-col justify-between">
                        <span class="text-[11px] font-bold text-blue-400"><i class="fa-solid fa-user-check mr-1"></i> 지금 내 편</span>
                        <strong id="luckyMate" class="text-white text-sm font-bold self-end text-right leading-tight">MBTI<br>혈액형</strong>
                    </div>
                    <div class="bg-gray-900 p-4 rounded-2xl border border-gray-700 h-24 flex flex-col justify-between">
                        <span class="text-[11px] font-bold text-red-400"><i class="fa-solid fa-user-xmark mr-1"></i> 멀리할 사람</span>
                        <strong id="badMate" class="text-gray-400 text-sm font-bold self-end text-right leading-tight">MBTI<br>혈액형</strong>
                    </div>
                </div>
            </div>

            <div class="flex flex-col gap-3 w-full max-w-xs mx-auto">
                <button onclick="location.reload()" class="w-full bg-gray-800 py-4 rounded-xl text-gray-300 font-bold text-base border border-gray-700 hover:bg-gray-700 transition">다시 뽑기</button>
                <button onclick="shareFortune()" class="w-full bg-gradient-to-r from-pink-500 to-orange-400 py-4 rounded-xl text-white font-black text-base shadow-lg hover:scale-[1.02] transition transform">
                    <i class="fa-solid fa-gift mr-2"></i> 행운 선물하기
                </button>
            </div>
        </div>
    </div>

    <!-- 관상 분석 모달 -->
    <div id="scanModal" class="hidden fixed inset-0 bg-black/95 z-50 flex flex-col items-center justify-center p-6">
        <h3 class="text-xl font-bold text-green-400 mb-8 tracking-widest animate-pulse">관상 및 기운 판독 시스템 가동</h3>
        <div class="relative w-72 h-72 border-2 border-green-500 rounded-2xl overflow-hidden shadow-[0_0_30px_rgba(34,197,94,0.3)]">
            <img id="scannedImage" class="w-full h-full object-cover opacity-60 grayscale brightness-110 contrast-125" />
            <div class="absolute inset-0 bg-gradient-to-b from-transparent via-green-400/50 to-transparent w-full h-8 scan-line"></div>
            <div class="absolute inset-0 border border-green-500/30 grid grid-cols-3 grid-rows-3 pointer-events-none">
                <div class="border-b border-r border-green-500/30"></div><div class="border-b border-r border-green-500/30"></div><div class="border-b border-green-500/30"></div>
                <div class="border-b border-r border-green-500/30"></div><div class="border-b border-r border-green-500/30"></div><div class="border-b border-green-500/30"></div>
                <div class="border-r border-green-500/30"></div><div class="border-r border-green-500/30"></div><div></div>
            </div>
        </div>
        <div id="scanLog" class="mt-8 text-green-400 font-mono text-sm h-16 text-center leading-relaxed">데이터 수집 중...</div>
    </div>

    <script>
        let selectedMode = null;
        let currentAngelData = null; 
        let scoreInterval; 

        const themes = {
            'myth': { label: '신화 (Legend) 등급', hex: '#eab308', gradStart: '#eab308', gradEnd: '#fde047' },
            'hero': { label: '영웅 (Hero) 등급', hex: '#94a3b8', gradStart: '#94a3b8', gradEnd: '#e2e8f0' },
            'rare': { label: '천기 (Rare) 등급', hex: '#a855f7', gradStart: '#9333ea', gradEnd: '#d8b4fe' },
            'special': { label: '영기 (Special) 등급', hex: '#22c55e', gradStart: '#16a34a', gradEnd: '#86efac' },
            'normal': { label: '인연 (Normal) 등급', hex: '#3b82f6', gradStart: '#2563eb', gradEnd: '#93c5fd' }
        };

        const tools = ["볼펜", "샤프", "포스트잇", "고무줄", "연습장", "머리띠", "1만원 현금", "1천원 현금", "손거울", "종이컵", "텀블러"];
        const mbtis = ["INFP", "ENFP", "INFJ", "ENFJ", "INTJ", "ENTJ", "INTP", "ENTP", "ISFP", "ESFP", "ISTP", "ESTP", "ISFJ", "ESFJ", "ISTJ", "ESTJ"];
        const bloods = ["A형", "B형", "O형", "AB형"];

        const sajuElements = [
            { name: '木 (나무)', color: 'text-green-400', bg: 'bg-green-900/40' },
            { name: '火 (불)', color: 'text-red-400', bg: 'bg-red-900/40' },
            { name: '土 (흙)', color: 'text-yellow-600', bg: 'bg-yellow-900/40' },
            { name: '金 (쇠)', color: 'text-gray-300', bg: 'bg-gray-700/60' },
            { name: '水 (물)', color: 'text-blue-400', bg: 'bg-blue-900/40' }
        ];

        const sajuAdvices = [
            "의 기운이 크게 부족한 찰나입니다. 이 기운을 지닌 사람을 찾아 조언을 구하거나 관련된 장소에서 잠시 휴식을 취해야 일이 풀립니다.",
            "의 기운이 충만한 귀인이 곁에 맴돌고 있습니다. 마음을 열고 그 사람의 제안을 수용하면 뜻밖의 이득을 쟁취할 수 있습니다.",
            "의 기운이 과도하게 넘쳐흐르고 있습니다. 이 뜨거운 에너지를 주체하지 못하면 화가 될 수 있으니 오늘은 한 템포 쉬어가는 것이 절대적으로 유리합니다.",
            "의 기운을 가진 자와 강하게 충돌할 수 있는 운세입니다. 가급적 감정적인 논쟁을 피하고 먼저 자세를 낮추어 불필요한 액운을 방어하세요."
        ];

        // 135종 이름 데이터

        function getRandomAngel() {
            const rand = Math.random();
            let selectedLevel = '';
            if (rand < 0.05) selectedLevel = 'myth';          // 5%
            else if (rand < 0.20) selectedLevel = 'hero';     // 15%
            else if (rand < 0.40) selectedLevel = 'rare';     // 20%
            else if (rand < 0.65) selectedLevel = 'special';  // 25%
            else selectedLevel = 'normal';                    // 35%

            const filteredAngels = allAngels.filter(angel => angel.level === selectedLevel);
            return filteredAngels[Math.floor(Math.random() * filteredAngels.length)];
        }

        function updateClock() {
            const now = new Date();
            const hrDeg = (now.getHours() % 12) * 30 + (now.getMinutes() / 2) - 50; 
            const minDeg = now.getMinutes() * 6 + (now.getSeconds() / 10) - 50;
            const secDeg = now.getSeconds() * 6 + (now.getMilliseconds() * 0.006) - 50;
            document.getElementById('hourHand').style.transform = `translateX(-50%) rotate(${hrDeg}deg)`;
            document.getElementById('minHand').style.transform = `translateX(-50%) rotate(${minDeg}deg)`;
            document.getElementById('secHand').style.transform = `translateX(-50%) rotate(${secDeg}deg)`;
            
            const msStr = String(now.getMilliseconds()).padStart(3, '0').substring(0, 2);
            document.getElementById('digitalClock').innerText = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}:${msStr}`;
            requestAnimationFrame(updateClock);
        }
        requestAnimationFrame(updateClock);

            document.getElementById('btnFortune').classList.remove('active');

        function triggerFaceScan() { document.getElementById('faceInput').click(); }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const modal = document.getElementById('scanModal');
                document.getElementById('scannedImage').src = e.target.result;
                modal.classList.remove('hidden');
                
                const logs = ["얼굴 윤곽 분석 중...", "이목구비 비율 계산 중...", "관상학적 음양오행 데이터 추출...", "배경 기운 및 오라(Aura) 판독...", "최적의 수호천사 매칭 중..."];
                let step = 0;
                document.getElementById('scanLog').innerText = logs[step];
                const interval = setInterval(() => { step++; if(step < logs.length) document.getElementById('scanLog').innerText = logs[step]; }, 1000);
                setTimeout(() => { clearInterval(interval); modal.classList.add('hidden'); selectMode('face'); document.getElementById('faceInput').value = ''; }, 5000);
            };
            reader.readAsDataURL(file);
        }

        function startSummoning() {
            if(!selectedMode) return;
            
            // 1단계: 구름, 번개, 화면 흔들림 + 카드 고속 회전
            document.body.classList.add('screen-shake');
            document.getElementById('lightningOverlay').classList.add('lightning-active');
            document.getElementById('fogOverlay').classList.add('fog-active');
            document.getElementById('mainScreen').style.opacity = '0';
            
            const resultScreen = document.getElementById('resultScreen');
            resultScreen.classList.remove('hidden');
            resultScreen.style.display = 'flex';
            resultScreen.scrollTop = 0;
            
            const cardInner = document.getElementById('cardInner');
            cardInner.classList.add('card-show', 'spinning-card'); // 카드 중앙 배치 및 고속 스핀
            
            const angel = getRandomAngel();
            currentAngelData = angel; 

            // 2단계: 광명(해돋이) 페이드인
            setTimeout(() => {
                document.getElementById('sunriseOverlay').classList.add('sunrise-active');

            setTimeout(() => {
                document.getElementById('whiteFlash').classList.add('flash-active');

                // 불필요한 오버레이 제거

        function initObserver(angel) {
            const statsContainer = document.getElementById('statsContainer');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        statsContainer.classList.remove('opacity-0', 'translate-y-10');
                        statsContainer.classList.add('opacity-100', 'translate-y-0');
                        runStatsAnimation(angel);
                    } else {
                        statsContainer.classList.remove('opacity-100', 'translate-y-0');
                        statsContainer.classList.add('opacity-0', 'translate-y-10');
                        document.getElementById('fortuneScore').innerText = '0';
                        document.getElementById('starContainer').innerHTML = '';
                        clearInterval(scoreInterval);
                    }
                });
            }, { threshold: 0.1 });
            observer.observe(statsContainer);
        }

        function runStatsAnimation(angel) {
            const theme = themes[angel.level];
            let currentScore = 0;
            const scoreEl = document.getElementById('fortuneScore');
            
            clearInterval(scoreInterval);
            scoreInterval = setInterval(() => {
                currentScore += 3;
                if(currentScore >= angel.score) {
                    currentScore = angel.score;
                    clearInterval(scoreInterval);
                }
                scoreEl.innerText = currentScore;
            }, 25);

            const starContainer = document.getElementById('starContainer');
            starContainer.innerHTML = '';
            for(let i=0; i<10; i++) {
                const star = document.createElement('i');
                if(i < angel.stars) {
                    star.className = `star-item opacity-0 scale-0 fa-solid fa-star drop-shadow-md`;
                    star.style.color = theme.hex;
                } else {
                    star.className = `star-item opacity-0 scale-0 fa-regular fa-star text-gray-600`;
                }
                starContainer.appendChild(star);
                
                setTimeout(() => {
                    star.classList.remove('opacity-0', 'scale-0');
                    star.classList.add('opacity-100', 'scale-100');
                }, 100 * (i + 1));
            }
        }

        function shareFortune() {
            if(!currentAngelData) return;
            const gifts = ["행운", "건강", "기쁨", "웃음", "평안", "성공", "사랑"];
            const randomGift = gifts[Math.floor(Math.random() * gifts.length)];
            const randomScore = Math.floor(Math.random() * 71) + 30;
            
            const shareText = `나의 수호천사: ${currentAngelData.name}\n지금 행운 점수: ${currentAngelData.score}점\n\n당신에게 '${randomGift}'을(를) ${randomScore}점 만큼 선물합니다! 🎁\n\n나의 수호천사 뽑아보기 👇`;
            
            if (navigator.share) {
                navigator.share({
                    title: '지금 이 순간 수호천사',
                    text: shareText,
                    url: window.location.href
                }).catch(console.error);
            } else {
                navigator.clipboard.writeText(`${shareText}\n${window.location.href}`)
                    .then(() => alert('행운 메시지가 클립보드에 복사되었습니다. 친구에게 붙여넣기 해보세요!'))
                    .catch(() => alert('공유하기를 지원하지 않는 브라우저입니다.'));
            }
        }
    </script>
