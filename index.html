<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>길운이 드는 시간</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://hangeul.pstatic.net/hangeul_static/css/maru-buri.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #0f172a; color: white; overflow-x: hidden; scroll-behavior: smooth; }
        .font-maruburi { font-family: 'MaruBuri', serif; }
        
        #mainScreen { background-image: linear-gradient(to bottom, rgba(15,23,42,0.6), rgba(15,23,42,1)), url('./images/title.png'); background-size: cover; background-position: center; }
        
        .clock-face { width: 220px; height: 220px; border-radius: 50%; border: 6px solid #fbbf24; position: relative; background: radial-gradient(circle, #1e293b 0%, #0f172a 100%); box-shadow: 0 0 30px rgba(251, 191, 36, 0.3); margin: 0 auto; }
        .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom; background: white; border-radius: 4px; transform: translateX(-50%); transition: transform 0.05s cubic-bezier(0.4, 2.08, 0.55, 0.44); }
        .hour-hand { width: 4px; height: 55px; background: #cbd5e1; }
        .min-hand { width: 3px; height: 80px; background: #f8fafc; }
        .sec-hand { width: 2px; height: 95px; background: #ef4444; }
        .clock-center { position: absolute; top: 50%; left: 50%; width: 14px; height: 14px; background: #fbbf24; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        
        .mode-btn { transition: all 0.3s ease; }
        .mode-btn.active { border-color: #fbbf24; background-color: rgba(251, 191, 36, 0.1); box-shadow: 0 0 15px rgba(251, 191, 36, 0.4); transform: translateY(-2px); }

        .sky-overlay { position: fixed; inset: 0; z-index: 45; opacity: 0; pointer-events: none; transition: opacity 2s; }
        .night-sky { background: linear-gradient(to bottom, #020111 0%, #20124d 100%); }
        .dawn-sky { background: linear-gradient(to bottom, #1a2a6c, #b21f1f, #fdbb2d); opacity: 0; transition: opacity 3s; }
        .clouds { position: absolute; width: 200%; height: 100%; background: url('https://www.transparenttextures.com/patterns/stardust.png'); animation: moveClouds 20s linear infinite; opacity: 0.4; }
        @keyframes moveClouds { from { transform: translateX(0); } to { transform: translateX(-50%); } }

        .perspective { perspective: 1500px; }
        .card-inner { position: relative; width: 100%; height: 100%; text-align: center; transform-style: preserve-3d; transition: transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform: scale(0.3) translateY(200px); opacity: 0; }
        .card-show { transform: scale(1) translateY(0); opacity: 1; }
        .card-inner.is-flipped { transform: scale(1) translateY(0) rotateY(180deg); }
        
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); border-width: 4px; border-style: solid;}
        .card-front { background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .card-back { transform: rotateY(180deg); background-color: #0f172a; overflow: hidden; }

        .gauge-container { position: absolute; top: 15px; left: 15px; width: 50px; height: 50px; border-radius: 50%; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 20; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        .circular-chart { display: block; margin: 0 auto; max-width: 100%; max-height: 250px; }
        .circle-bg { fill: none; stroke: #334155; stroke-width: 3.8; }
        .circle { fill: none; stroke-width: 3.8; stroke-linecap: round; transition: stroke-dasharray 1.5s ease-out; }
        .gauge-text { position: absolute; font-size: 11px; font-weight: 900; color: white; text-shadow: 1px 1px 2px black; }
        .gauge-label { position: absolute; bottom: -18px; font-size: 10px; font-weight: bold; color: #fbbf24; text-shadow: 1px 1px 2px black; }

        .yin-yang-container { display: flex; flex-direction: column; align-items: center; background: rgba(0,0,0,0.4); border-radius: 15px; padding: 15px; margin-top: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .hanja-large { font-size: 2.4rem; font-weight: 900; margin-bottom: 5px; text-shadow: 0 0 15px currentColor; transition: transform 0.5s; }
        .hanja-large.animate { transform: scale(2); }

        .lotto-grid { display: flex; justify-content: space-between; gap: 8px; width: 100%; margin-top: 15px; position: relative; }
        .lotto-card { width: 100%; aspect-ratio: 2.8/4; perspective: 1000px; cursor: pointer; transform: scale(1.1); margin: 3% 0; }
        .lotto-inner { position: relative; width: 100%; height: 100%; text-align: center; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }
        .lotto-card.flipped .lotto-inner { transform: rotateY(180deg); }
        .lotto-front, .lotto-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 900; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .lotto-front { background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid #334155; color: #64748b; font-size: 1.6rem; }
        .lotto-back { transform: rotateY(180deg); background: radial-gradient(circle, #f59e0b, #d97706); color: white; border: 2px solid #fbbf24; font-size: 1.6rem; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        .lotto-hint { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; text-align: center; pointer-events: none; z-index: 10; animation: blink 1.5s infinite; font-weight: bold; color: #fbbf24; background: rgba(0,0,0,0.6); padding: 5px; border-radius: 5px; }
        
        .scan-line-oriental { animation: scanMoveOriental 3s ease-in-out infinite; }
        @keyframes scanMoveOriental { 0% { transform: translateY(-100%); } 50% { transform: translateY(300px); } 100% { transform: translateY(-100%); } }
        
        .hanja-float { animation: floatHanja 4s ease-in-out infinite; }
        @keyframes floatHanja { 0%, 100% { opacity: 0; transform: translateY(10px) scale(0.8); } 50% { opacity: 0.8; transform: translateY(-10px) scale(1.2); text-shadow: 0 0 15px #fde047; } }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body class="min-h-screen flex flex-col relative">

    <div id="nightOverlay" class="sky-overlay night-sky">
        <div class="clouds"></div>
        <div id="dawnOverlay" class="sky-overlay dawn-sky"></div>
    </div>
    
    <input type="file" id="faceInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">

    <div id="mainScreen" class="flex-1 flex flex-col items-center pt-8 px-6 pb-6 relative z-10 transition-opacity duration-1000">
        <h1 class="text-[2.16rem] font-black text-[#fbbf24] mb-8 text-center leading-tight drop-shadow-[0_0_15px_rgba(251,191,36,0.5)] tracking-tight font-maruburi mt-4" style="-webkit-text-stroke: 1.5px #fbbf24;">
            길운이 드는 시간
        </h1>
        
        <div class="clock-face mb-8 mt-4">
            <div id="hourHand" class="hand hour-hand"></div>
            <div id="minHand" class="hand min-hand"></div>
            <div id="secHand" class="hand sec-hand"></div>
            <div class="clock-center"></div>
        </div>

        <div id="digitalClock" class="text-3xl font-mono text-yellow-400 font-bold tracking-widest mb-12 drop-shadow-[0_0_10px_rgba(251,191,36,0.5)]">00:00:00:00</div>

        <div class="flex gap-4 mb-10 w-full max-w-sm mt-auto">
            <button id="btnFortune" onclick="selectMode('fortune')" class="mode-btn flex-1 bg-gray-800/80 backdrop-blur text-gray-300 py-4 rounded-xl border-2 border-gray-700">
                <i class="fa-solid fa-star-and-crescent mb-2 text-xl block"></i>
                <span class="text-sm">지금 이 순간</span><br><span class="font-bold text-white text-lg">운세 알아보기</span>
            </button>
            <button id="btnFace" onclick="triggerFaceScan()" class="mode-btn flex-1 bg-gray-800/80 backdrop-blur text-gray-300 py-4 rounded-xl border-2 border-gray-700">
                <i class="fa-solid fa-camera mb-2 text-xl block"></i>
                <span class="text-sm">지금 이 순간</span><br><span class="font-bold text-white text-lg">관상 알아보기</span>
            </button>
        </div>

        <button id="btnSummon" onclick="startSummoning()" disabled class="w-full max-w-sm bg-gradient-to-r from-yellow-600 to-yellow-400 text-gray-900 font-black py-5 rounded-2xl shadow-[0_0_15px_rgba(251,191,36,0.2)] transition-all transform opacity-40 cursor-not-allowed mb-8">
            <div class="text-sm opacity-90 mb-1">모드를 먼저 선택해주세요</div>
            <div class="text-2xl animate-pulse">운명과 시간이 만나는 순간</div>
        </button>
    </div>

    <!-- Scan Modal -->
    <div id="scanModal" class="hidden fixed inset-0 bg-black/95 z-50 flex flex-col items-center justify-center p-6">
        <h3 class="text-2xl font-bold text-yellow-400 mb-8 tracking-widest animate-pulse font-maruburi">관상 및 기운 판독 시스템</h3>
        <div class="relative w-72 h-72 border-2 border-yellow-700/50 rounded-full overflow-hidden shadow-[0_0_40px_rgba(251,191,36,0.2)] bg-gray-900 flex items-center justify-center">
            <img id="scannedImage" class="absolute w-full h-full object-cover opacity-50 sepia-[.5] brightness-110 contrast-125" />
            
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-30 animate-[spin_10s_linear_infinite]">
                <i class="fa-solid fa-yin-yang text-[12rem] text-yellow-500"></i>
            </div>
            
            <div id="hanjaOverlay" class="absolute inset-0 pointer-events-none hidden items-center justify-center">
                <span class="hanja-float absolute text-4xl text-yellow-300 font-bold opacity-0 font-maruburi" style="top:20%; left:20%; animation-delay: 0s;">木</span>
                <span class="hanja-float absolute text-4xl text-yellow-300 font-bold opacity-0 font-maruburi" style="top:20%; right:20%; animation-delay: 1s;">火</span>
                <span class="hanja-float absolute text-4xl text-yellow-300 font-bold opacity-0 font-maruburi" style="bottom:20%; right:20%; animation-delay: 2s;">金</span>
                <span class="hanja-float absolute text-4xl text-yellow-300 font-bold opacity-0 font-maruburi" style="bottom:20%; left:20%; animation-delay: 3s;">水</span>
                <span class="hanja-float absolute text-5xl text-yellow-400 font-bold opacity-0 font-maruburi" style="animation-delay: 1.5s;">土</span>
            </div>
            
            <div class="absolute inset-0 bg-gradient-to-b from-transparent via-yellow-500/40 to-transparent w-full h-12 scan-line-oriental"></div>
        </div>
        <div id="scanLog" class="mt-8 text-yellow-400 font-mono text-sm h-16 text-center leading-relaxed">얼굴 윤곽 분석 중...</div>
    </div>

    <div id="resultScreen" class="hidden flex-1 flex-col items-center p-6 relative z-10 pb-20 overflow-y-auto w-full max-w-2xl mx-auto">
        <div class="perspective w-72 h-[420px] mx-auto mt-2 mb-8 z-10 shrink-0">
            <div id="cardInner" class="card-inner">
                <div id="cardFront" class="card-front">
                    <i class="fa-solid fa-bolt text-5xl mb-4 animate-bounce" id="loadingIcon"></i>
                    <p id="loadingText" class="font-bold tracking-[0.3em] text-lg">SUMMONING</p>
                </div>
                <div id="cardBack" class="card-back group">
                    <img id="cardImage" src="" class="w-full h-full object-cover opacity-80 group-hover:scale-110 transition-transform duration-[2000ms]">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent"></div>
                    
                    <div class="gauge-container">
                        <span class="gauge-label">신통력</span>
                        <svg viewBox="0 0 36 36" class="circular-chart">
                            <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            <path id="gaugePath" class="circle" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        </svg>
                        <div id="gaugeText" class="gauge-text">0%</div>
                    </div>

                    <div class="absolute bottom-6 left-4 w-full text-left">
                        <span id="rankBadge" class="text-black text-xs font-black px-4 py-1.5 rounded-full mb-3 inline-block shadow-lg">등급</span>
                        <h3 id="cardName" class="text-3xl font-black text-white drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)] tracking-tight">이름</h3>
                    </div>
                </div>
            </div>
        </div>

        <div class="w-full bg-gray-800/90 rounded-3xl px-2 py-8 border border-gray-700 backdrop-blur-md z-10 shadow-2xl relative">
            <div class="mb-8 relative px-2">
                <i class="fa-solid fa-quote-left text-3xl opacity-20 absolute -top-4 -left-1" id="quoteIcon"></i>
                <p id="fortuneMessage" class="text-[15px] text-gray-100 leading-relaxed break-keep relative z-10 pl-6 mt-2 font-medium"></p>
            </div>

            <div id="statsContainer" class="bg-gray-900/80 rounded-2xl p-5 mb-6 border border-gray-700/50 transform transition-all duration-500 opacity-0 translate-y-10 mx-2">
                <div class="flex justify-between items-end mb-4">
                    <div>
                        <span class="text-gray-400 text-xs font-bold tracking-widest block mb-1">지금 행운 점수</span>
                        <span id="fortuneScore" class="text-6xl font-black leading-none">0</span><span class="text-gray-500 font-bold ml-1">점</span>
                    </div>
                </div>
                
                <div class="yin-yang-container">
                    <span class="text-gray-400 text-xs font-bold mb-2">오행(五行) 기운</span>
                    <div id="yinYangHanja" class="hanja-large"></div>
                    <p id="actionMessage" class="text-[15px] font-bold text-white mt-4 text-center"></p>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-4 mx-2">
                <div id="luckyColorBox" class="p-3 rounded-2xl flex flex-col justify-between shadow-inner h-24 border border-black/20 relative">
                    <div>
                        <span class="text-[11px] font-bold text-white/90 drop-shadow-md block"><i class="fa-solid fa-palette mr-1"></i> 행운의 컬러</span>
                        <span id="pantoneCode" class="text-[9px] opacity-75 font-mono block mt-0.5 ml-1"></span>
                    </div>
                    <strong id="luckyColorName" class="text-white text-[16px] drop-shadow-md self-end text-right mt-auto"></strong>
                </div>
                <div class="bg-gray-900 p-4 rounded-2xl border border-gray-700 h-24 flex flex-col justify-between">
                    <span class="text-[11px] font-bold text-gray-400"><i class="fa-solid fa-compass mr-1"></i> 행운의 방향</span>
                    <strong id="luckyDirection" class="text-white text-lg font-black self-end text-right leading-tight">방향</strong>
                </div>
                <div class="bg-gray-900 p-4 rounded-2xl border border-gray-700 h-24 flex flex-col justify-between">
                    <span id="goodMateTitle" class="text-[11px] font-bold text-blue-400"><i class="fa-solid fa-user-check mr-1"></i> 지금 내 편</span>
                    <strong id="luckyMate" class="text-white text-sm font-bold self-end text-right leading-tight">MBTI<br>혈액형</strong>
                </div>
                <div class="bg-gray-900 p-4 rounded-2xl border border-gray-700 h-24 flex flex-col justify-between">
                    <span id="badMateTitle" class="text-[11px] font-bold text-red-400"><i class="fa-solid fa-user-xmark mr-1"></i> 멀리할 사람</span>
                    <strong id="badMate" class="text-gray-400 text-sm font-bold self-end text-right leading-tight">MBTI<br>혈액형</strong>
                </div>
            </div>

            <div class="bg-gray-900 px-2 py-5 rounded-2xl border border-gray-700 w-full relative mx-auto max-w-[95%]">
                <span class="text-[12px] font-bold text-gray-400 block text-center mb-2"><i class="fa-solid fa-clover mr-1 text-yellow-400"></i> 행운의 번호</span>
                <div id="lottoHint" class="lotto-hint">뒤집기</div>
                <div id="lottoGrid" class="lotto-grid"></div>
            </div>
        </div>

        <div class="flex flex-col gap-3 w-full max-w-xs mt-10 mb-8">
            <button onclick="location.reload()" class="w-full bg-gray-800 py-4 rounded-xl text-gray-300 font-bold text-base border border-gray-700 hover:bg-gray-700 transition">내 운명 바꾸기</button>
            <button onclick="shareFortune()" class="w-full bg-gradient-to-r from-pink-500 to-orange-400 py-4 rounded-xl text-white font-black text-base shadow-lg hover:scale-[1.02] transition transform">
                <i class="fa-solid fa-gift mr-2"></i> 행운 선물하기
            </button>
        </div>
    </div>

    <script>
        window.onload = () => { window.scrollTo(0, 0); };

적으로 매우 이례적인 행운입니다.", "운세 알고리즘 분석 결과, 오늘 하루는 리스크 대비 기대 수익이 가장 높은 최적의 타이밍으로 도출되었습니다.", "귀하의 생년월일시 해시값을 변환한 결과, 오늘 바이오리듬 종합 수치가 93.4%를 돌파했습니다.", "주변 환경의 변수 데이터가 귀하에게 유리한 방향으로 정렬되었습니다. 알고리즘이 당신의 압승을 예측합니다.", "현재 귀하의 사주 원국과 오늘의 세운이 99.9% 일치하는 완벽한 동기화 상태에 진입했습니다.", "불확실성 지수가 급격히 하락했습니다. 평소보다 과감한 의사결정을 내려도 안전한 데이터 구간입니다.", "운명의 변동성 그래프가 요동치고 있습니다. 롤러코스터에 탑승하셨으니 안전벨트를 단단히 매십시오.", "감정적 편향을 제거하고 순수 데이터만 추출한 결과, 귀하에게 다가오는 길운의 시그널이 명확합니다.", "전체 운세 지표의 KPI가 목표치를 초과 달성했습니다. 여유를 가지고 하루를 즐기셔도 좋습니다.", "전방위적인 기운 스캔이 완료되었습니다. 귀하의 앞길에 에러율 0%의 탄탄대로가 펼쳐집니다.", "운명의 로딩이 100% 완료되었습니다. 최적화된 상태로 오늘이라는 프로그램을 실행하십시오."], "wealth": ["자산 포트폴리오를 점검하기 좋은 시점입니다. 감정에 휘둘린 투자를 배제하고 객관적인 지표에 기반하여 자산을 재분배하십시오.", "지출될 확률이 높은 불필요한 고정비 데이터를 스캔해보십시오. 구독 서비스나 숨은 수수료를 찾아내어 리소스 낭비를 막으십시오.", "과거 데이터를 회귀 분석한 결과, 오늘 시도하는 소규모 투자는 긍정적인 ROI를 기록할 확률이 85% 이상입니다.", "오늘 오전의 지출 패턴은 감정적이고 충동적일 확률이 90%입니다. 장바구니에 담아두고 결제 버튼은 3시간 뒤에 누르십시오.", "귀하의 통장 잔고 우상향 그래프가 시작되는 변곡점입니다. 사소한 시드머니라도 소중히 아끼고 모으십시오.", "확률적으로 오늘은 일확천금의 복권이나 요행보다 안전 자산의 적금 이율을 확인하는 것이 훨씬 합리적인 선택입니다.", "금전 거래에서 디폴트 리스크가 크게 감지됩니다. 지인과의 거래는 시스템 오류를 발생시키니 철저히 차단하십시오.", "비용 절감의 마법이 필요한 날입니다. 점심 식대나 커피값에서 10%만 절약해도 한 달 뒤 엄청난 스노우볼 이펙트를 경험합니다.", "뜻밖의 수입이 발생할 확률 모델이 작동 중입니다. 중고 거래나 잊고 있던 포인트 환급 등을 통해 현금 유동성을 확보하십시오.", "손절매 타이밍이 도래했습니다. 손실이 발생하고 있는 투자처가 있다면 오늘 과감히 정리하는 것이 2차 피해를 막습니다.", "귀하의 자산 증식을 도울 AI나 금융 전문가의 알고리즘에 귀를 기울이십시오. 개인의 직관보다 집단 지성이 승리합니다.", "현금 흐름이 꽉 막힌 보틀넥 현상이 해소됩니다. 빌려주고 못 받았던 돈을 오늘 정중히 요구해 보십시오."], "work": ["업무 효율성이 평소 대비 130% 향상되는 구간입니다. 가장 복잡하고 논리력이 요구되는 태스크를 오전 중에 처리하시기 바랍니다.", "팀 내 의사결정 시 직관보다는 수치화된 데이터를 제시하십시오. 귀하의 제안이 채택될 확률이 기하급수적으로 상승합니다.", "발생 가능한 리스크 변수를 미리 리스트업 해두십시오. 플랜 B를 준비해둔다면 예외 상황에서도 시스템 오류 없이 넘어갈 수 있습니다.", "귀하의 퍼포먼스 데이터가 상위 5% 이내에 진입했습니다. 오늘은 적극적으로 당신의 성과를 어필할 최적의 타이밍입니다.", "멀티태스킹은 오늘 시스템 과부하를 초래합니다. 우선순위에 따라 하나의 프로세스에만 100%의 리소스를 할당하십시오.", "불필요한 미팅과 회의가 귀하의 생산성을 저하시키고 있습니다. 텍스트 기반의 비동기 커뮤니케이션으로 효율을 극대화하십시오.", "기존의 낡은 업무 프로세스를 디버깅(Debugging)해야 할 때입니다. 비효율적인 관행을 찾아내 과감히 수정 코드를 덮어씌우십시오.", "협업 시너지 수치가 최고점에 달했습니다. 오늘은 단독 플레이보다 팀 프로젝트에서 훨씬 더 폭발적인 결과물이 산출됩니다.", "클라이언트나 상사의 피드백 데이터 속에 핵심 인사이트가 숨어 있습니다. 감정적 필터를 제거하고 피드백 자체의 패턴만 분석하십시오.", "당신의 아이디어가 시장이나 조직의 니즈(Needs)와 95% 이상 매칭됩니다. 기획서를 제출하거나 새로운 제안을 던져보십시오.", "마감 기한 압박으로 인한 에러율 증가가 예상됩니다. 일정을 하루 정도 뒤로 미루거나 중간 점검 단계를 반드시 추가하십시오.", "자동화할 수 있는 반복 업무는 즉시 시스템에 맡기십시오. 당신의 두뇌 리소스는 창의적인 의사결정에만 사용되어야 합니다."], "relation": ["인간관계 네트워크에서 핵심 허브(Hub) 역할을 하는 인물과 컨택할 확률이 높습니다. 비즈니스적 시너지를 낼 수 있도록 네트워킹에 투자하십시오.", "감정적인 충돌 데이터가 감지되었습니다. 상대방의 비합리적인 주장에 감정적으로 대응하지 말고 팩트 기반으로 쿨하게 대처하십시오.", "불필요한 인맥 관리로 인한 리소스 낭비를 줄이십시오. 당신의 핵심 KPI에 도움이 되는 소수의 인연에 집중하는 것이 효율적입니다.", "귀하의 매력 지수 데이터가 오늘 최고치를 기록 중입니다. 새로운 릴레이션을 형성하기에 완벽한 조건이니 외출을 권장합니다.", "과거에 끊어졌던 링크(Link)가 다시 연결될 조짐이 보입니다. 오래된 지인에게서 오는 연락은 귀하에게 새로운 기회의 데이터를 제공할 것입니다.", "타인과의 커뮤니케이션 핑(Ping) 테스트 결과 지연율이 높습니다. 오늘은 메시지 전달 시 오해가 없도록 정확하고 명료한 텍스트를 사용하십시오.", "귀하를 향한 부정적인 백그라운드 노이즈가 발생하고 있습니다. 반응하지 마십시오. 시간이 지나면 노이즈는 자연히 소멸합니다.", "상호 이익을 창출할 수 있는 윈윈(Win-Win) 알고리즘이 성립되는 날입니다. 협상이나 거래에서 양보보다는 공동의 파이를 키우는 전략을 취하십시오.", "친밀도 데이터가 임계점을 넘지 못한 관계에는 무리하게 다가가지 마십시오. 오늘은 적당한 거리 유지가 시스템의 안정성을 보장합니다.", "귀하를 지지하는 로열(Loyal) 유저들의 피드백에 귀를 기울이십시오. 가까운 가족이나 연인에게 감사를 표현하는 것이 오늘 관계의 핵심입니다.", "새로운 커뮤니티나 플랫폼에 접속해보십시오. 귀하의 알고리즘에 신선한 자극과 유의미한 인간관계 데이터를 추가해 줄 것입니다.", "상대방의 언어 데이터 이면에 숨겨진 의도(Intent)를 파악하십시오. 표면적인 말보다는 그들의 행동 패턴을 분석하는 것이 정확합니다."], "health": ["신체 데이터 모니터링 결과, 수면 부채가 누적되어 있을 확률이 높습니다. 오늘 밤은 블루라이트를 차단하고 7.5시간 이상의 수면을 확보하십시오.", "당류 섭취 데이터가 기준치를 초과할 가능성이 보입니다. 오늘은 정제 탄수화물을 제한하고 카페인 의존도를 낮추는 것을 권장합니다.", "장시간 동일한 자세로 인한 코어 근육 약화가 우려됩니다. 50분 업무 후 10분 스트레칭 루틴을 시스템에 입력하고 강제 실행하십시오.", "귀하의 스트레스 지수 그래프가 위험 수위에 도달하기 직전입니다. 즉시 작업을 중단하고 시각과 청각을 차단한 채 15분간 시스템을 리부팅(휴식)하십시오.", "수분 섭취량이 일일 권장량의 50%에도 미치지 못할 확률이 높습니다. 즉시 500ml의 물을 섭취하여 체내 순환 시스템을 정상화하십시오.", "안구 건조 및 시력 저하 데이터가 감지되었습니다. 스마트 기기 시청 시간을 어제 대비 30% 감축하고, 인공눈물로 각막을 보호하십시오.", "심박 변이도(HRV) 분석 결과, 유산소 운동이 강력하게 요구됩니다. 퇴근 후 40분 이상의 빠른 걷기나 러닝을 통해 심폐 기능을 활성화하십시오.", "체내 면역 시스템의 방화벽이 일시적으로 약화된 상태입니다. 일교차에 대비한 아우터를 지참하고 다중 이용 시설 방문을 자제하십시오.", "위장 장애 에러 로그가 반복해서 쌓이고 있습니다. 자극적인 음식 데이터의 입력을 중단하고, 소화가 잘 되는 클린 식단으로 위장을 포맷하         const elementData = {"木": {"c": "#10b981", "m": ["자연과 이치에 순응하라. 억지로 막힌 것을 뚫으려다간 도리어 다칠 수 있다. 나무처럼 조용히 뿌리를 내릴 때다.", "당장의 눈에 띄는 성장보다 내실을 다져야 비바람에 흔들리지 않는다. 깊게 심호흡하고 기초를 점검하라.", "새싹이 돋아나듯 새로운 아이디어와 시작에 길한 기운이 깃들어 있다. 주저하지 말고 당신의 능력을 틔워라.", "거목은 하루아침에 자라지 않는다. 조급함을 버리고 긴 호흡으로 묵묵히 나아가면 반드시 숲을 이룰 것이다.", "유연한 나뭇가지가 강풍을 버텨낸다. 오늘은 뻣뻣한 고집을 꺾고 타인의 의견에 부드럽게 휘어질 줄 알아야 한다.", "겨울을 견딘 나무만이 봄에 꽃을 피운다. 지금의 고난은 성장을 위한 자양분이니 묵묵히 견뎌내라.", "위로만 자라려 하지 말고 옆으로 가지를 뻗어라. 오늘은 주변 사람들과 넓게 교류하며 기반을 다져야 할 때다.", "뿌리가 깊지 않으면 작은 바람에도 흔들린다. 새로운 것을 좇기보다 본질과 초심으로 돌아가라.", "대나무의 강함은 비어있음에 있다. 마음속 욕심을 비워내야 오히려 더 높이, 곧게 뻗어나갈 수 있다.", "한 그루의 나무가 숲을 이룰 수는 없다. 독단적인 행동을 삼가고 팀워크와 협력을 최우선으로 삼아라.", "낡은 잎을 떨어뜨려야 새 잎이 돋는다. 과거의 실패나 미련에 얽매이지 말고 과감히 털어내라.", "부드러움이 강함을 이긴다. 오늘은 강하게 부딪히기보다 우회하고 설득하는 부드러운 화법이 유리하다.", "씨앗을 뿌리기 가장 좋은 날이다. 작은 계획이라도 좋으니 오늘 당장 실천의 첫걸음을 떼어라.", "햇빛을 향해 자라는 식물처럼, 긍정적이고 밝은 사람 곁에 머물러라. 좋은 에너지가 흡수될 것이다.", "곧게 뻗은 나무는 목수의 표적이 되기 쉽다. 오늘은 너무 앞서 나가거나 잘난 체하지 말고 겸손을 유지하라."]}, "火": {"c": "#ef4444", "m": ["태양의 열정으로 멈춰있던 계획을 실행하라. 머뭇거리면 운이 식어버리니 즉각적인 행동이 필요하다.", "어둠을 밝히는 횃불처럼 당신의 직관이 예리하게 빛나는 날이다. 타인의 조언보다 당신의 느낌을 믿어라.", "불길은 바람을 타야 번지는 법이다. 오늘은 주변 사람들과 적극적으로 교류하며 당신의 기세를 넓혀라.", "과도한 불꽃은 주변을 다 태울 수 있다. 넘치는 감정과 분노를 통제하지 못하면 다 된 밥에 재를 빠뜨리게 된다.", "오래 묵은 찌꺼기를 불태워 정화할 시점이다. 과거의 미련이나 악습을 단호하게 끊어내고 새롭게 타올라라.", "장작이 있어야 불이 유지된다. 열정만 앞세우지 말고 실질적인 자본이나 체력을 충분히 비축하라.", "따뜻한 온기가 사람을 모은다. 오늘은 날카로운 비판보다 다정한 위로와 칭찬으로 타인을 대하라.", "가장 뜨거운 불꽃은 파란색이다. 겉으로 흥분하기보다 속으로 차갑고 치밀하게 에너지를 응축하라.", "불똥이 엉뚱한 곳으로 튈 수 있다. 오늘은 사소한 말실수나 부주의가 큰 화재로 번질 수 있으니 입을 무겁게 하라.", "재를 뒤적이면 숨은 불씨를 찾을 수 있다. 실패했다고 생각했던 프로젝트나 인연을 다시 한번 점검해 보라.", "화려한 불꽃놀이처럼 당신의 매력이 돋보이는 날이다. 주저하지 말고 무대의 중심에 서라.", "불은 위로만 솟구치려는 성질이 있다. 자만심을 경계하고 자신을 낮추어야 흉운을 피할 수 있다.", "번개처럼 빠르고 강렬한 기회가 스쳐 지나간다. 망설이는 순간 사라지니 본능적으로 낚아채라.", "차가운 이성이 마비되기 쉬운 날이다. 중요한 계약이나 결제는 하루 뒤로 미루는 것이 안전하다.", "온몸을 데우는 열기가 가득하다. 땀을 흘리는 운동이나 활동적인 일정을 소화하면 기운이 더욱 맑아진다."]}, "土": {"c": "#a16207", "m": ["흔들리지 않는 굳건함이 필요하다. 중심을 무겁게 잡고 얕은 외부의 유혹과 달콤한 말을 차단하라.", "만물을 품는 대지처럼 포용력을 발휘하라. 타인의 실수를 부드럽게 덮어주면 훗날 더 큰 은혜로 돌아온다.", "엉성한 기반을 다지는 날이다. 문서, 계약, 혹은 재정 상태를 꼼꼼하게 점검하여 새는 틈새를 메워야 한다.", "묵직한 바위처럼 제자리를 지켜라. 이리저리 옮겨 다니거나 변덕을 부리면 굴러오던 큰 복도 튕겨 나간다.", "비 온 뒤에 땅이 굳는 형국이다. 최근 겪었던 갈등과 시련이 오히려 당신을 더 단단한 그릇으로 만들어 줄 것이다.", "흙 속에 진주가 묻혀 있다. 겉보기엔 초라하고 평범해 보이는 제안 속에 엄청난 기회가 숨어 있으니 자세히 살펴라.", "높은 산은 오르기 힘들지만 시야가 넓다. 단기적인 손해에 연연하지 말고 3년 뒤를 바라보는 결정을 내려라.", "황무지를 개간하는 고단함이 따르지만 그 땅은 온전히 당신의 것이 된다. 남들이 기피하는 궂은일을 자처하라.", "땅이 너무 메마르면 갈라진다. 지나친 완벽주의를 버리고 스스로에게 작은 여유와 보상을 허락하라.", "흙탕물이 가라앉기를 기다려라. 지금 당장 시시비비를 가리려 하지 말고 시간이 해결해주도록 한 발 물러서라.", "씨앗을 품고 침묵하는 겨울 땅처럼, 지금은 당신의 패를 남에게 보여주지 말고 조용히 힘을 기를 때다.", "비옥한 토양에 잡초도 무성해지는 법이다. 좋은 기회와 함께 찾아오는 방해꾼과 사기꾼을 각별히 경계하라.", "그릇을 빚기 위해선 진흙을 치대야 한다. 오늘 마주치는 귀찮은 과정들은 당신의 완성도를 높이는 필수 작업이다.", "오래된 지층처럼 차곡차곡 쌓인 당신의 경험이 빛을 발한다. 새로운 방식보다 가장 익숙하고 잘하는 방식을 택하라.", "대지는 모든 생명의 어머니와 같다. 오늘 하루는 가족이나 가장 가까운 지인들을 살뜰히 챙겨라."]}, "金": {"c": "#f59e0b", "m": ["강한 결단력이 필요한 시점. 맺고 끊음을 확실히 하여 불필요한 인간관계와 헛된 지출을 가차 없이 정리하라.", "잘 벼려진 검처럼 냉철하고 이성적으로 판단하라. 오늘은 정에 이끌리거나 감정에 휘둘려서는 결코 안 되는 날이다.", "가을의 추수기처럼 그동안 뿌린 노력의 결실을 거둬들일 기운이 강하다. 당신의 정당한 성과를 적극적으로 요구하라.", "원석을 세공하여 보석을 만드는 과정이다. 비판을 두려워하지 말고 쓴소리를 약으로 삼아야 빛이 난다.", "금전의 기운이 날카롭게 돌고 있다. 확실한 곳에는 과감히 베팅하되, 운에 기대는 투기에는 절대 손대지 마라.", "녹슨 칼로는 아무것도 밸 수 없다. 나태해진 루틴과 무뎌진 기술을 날카롭게 재정비할 시간이다.", "금속은 부딪히면 맑은 소리가 난다. 오늘은 숨기지 말고 정면으로 부딪혀 토론하고 의견을 조율하라.", "굳건한 갑옷처럼 스스로를 방어해야 한다. 남의 문제에 함부로 동정심을 가지거나 보증을 서는 일은 절대 금물이다.", "가을바람에 낙엽이 떨어지듯 자연스러운 이별이나 종료가 일어날 수 있다. 억지로 붙잡지 말고 순리에 맡겨라.", "정밀한 저울처럼 공평하게 처신하라. 편애하거나 치우친 판결을 내리면 원망을 사게 되니 원리원칙을 고수하라.", "반짝이는 것에 현혹되지 마라. 화려한 언변이나 포장지 속에 빈 껍데기만 있을 확률이 농후하다.", "작은 바늘 하나가 큰 풍선을 터뜨린다. 사소해 보이는 디테일 하나를 놓치면 전체가 무너지니 끝까지 긴장하라.", "단호하게 '아니오'라고 말할 용기가 필요하다. 거절하지 못해 끌려다니면 당신의 시간과 에너지만 탈탈 털리게 된다.", "날카로운 도구는 나 자신도 베일 수 있다. 당신의 직설적인 조언이 타인에게 상처가 될 수 있으니 단어를 순화하라.", "종소리가 멀리 퍼지듯 당신의 평판이 널리 알려지는 날이다. 언행을 각별히 조심하고 옷차림을 단정히 하라."]}, "水": {"c": "#3b82f6", "m": ["마음의 상처를 먼저 돌보라. 타인을 향한 따뜻한 위로와 공감이 곧 나 스스로를 치유하는 강력한 길이 된다.", "물은 장애물을 만나면 다투지 않고 조용히 돌아간다. 오늘은 정면충돌을 피하고 한 발짝 우회하는 지혜가 필요하다.", "고인 물은 결국 썩기 마련이다. 새로운 지식을 배우거나 낯선 곳으로 발걸음을 옮겨 변화의 물꼬를 강하게 터라.", "깊은 바다처럼 속내를 가볍게 드러내지 마라. 묵직한 침묵이 오히려 당신의 무기가 되고 상대의 존중을 이끌어낸다.", "메마른 대지에 단비가 내린다. 꽉 막혀있던 관계나 자금 줄이 보이지 않는 귀인의 도움으로 서서히 풀려나갈 것이다.", "탁류가 가라앉기를 기다려라. 상황이 혼란스럽고 복잡할 때는 아무런 결정을 내리지 않는 것이 최고의 결정이다.", "물은 어떤 그릇에 담기느냐에 따라 모양이 변한다. 환경에 불평하지 말고 당신이 먼저 유연하게 맞춰가는 처세가 필요하다.", "얼음처럼 차갑게 냉각기를 가져라. 뜨거운 감정으로 인한 다툼이 예상되니, 즉각 대답하지 말고 하루 정도 생각할 시간을 벌어라.", "바닥을 치고 다시 차오르는 밀물의 기운이다. 그동안의 슬럼프나 우울감에서 벗어나 활력을 되찾는 날이다.", "수면 아래에는 거대한 빙산이 숨어 있다. 상대방이 보여주는 겉모습만 믿지 말고 그 이면의 숨은 의도를 철저히 파악하라.", "맑은 샘물처럼 투명하게 행동하라. 오늘은 얕은 수작이나 거짓말이 금방 들통나게 되니 무조건 솔직함으로 승부하라.", "강물이 모여 바다로 가듯 작은 수익과 인연들이 모여 큰 자산을 이룬다. 자잘한 업무나 스쳐가는 사람도 소중히 대하라.", "눈물로 씻어내야 할 감정이 남아 있다. 슬픈 영화를 보거나 혼자만의 시간을 가지며 속 시원하게 감정을 분출하라.", "깊은 심연에서 아이디어를 건져 올릴 수 있다. 주변의 소음을 차단하고 혼자만의 명상이나 산책에 집중하라.", "겨울 호수처럼 고요하지만 생명을 품고 있다. 당장 겉으로 성과가 보이지 않아도 내부에서는 엄청난 에너지가 축적되고 있다."]}};

            const minDeg = now.getMinutes() * 6 + (now.getSeconds() / 10);
            const secDeg = now.getSeconds() * 6;
            document.getElementById('hourHand').style.transform = `translateX(-50%) rotate(${hrDeg}deg)`;
            document.getElementById('minHand').style.transform = `translateX(-50%) rotate(${minDeg}deg)`;
            document.getElementById('secHand').style.transform = `translateX(-50%) rotate(${secDeg}deg)`;
            
            const msStr = String(now.getMilliseconds()).padStart(3, '0').substring(0, 2);
            document.getElementById('digitalClock').innerText = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}:${msStr}`;
            requestAnimationFrame(updateClock);
        }
        requestAnimationFrame(updateClock);

        function selectMode(mode) {
            selectedMode = mode;
            document.getElementById('btnFortune').classList.remove('active');
            document.getElementById('btnFace').classList.remove('active');
            if(mode === 'fortune') document.getElementById('btnFortune').classList.add('active');
            if(mode === 'face') { document.getElementById('btnFace').classList.add('active'); triggerFaceScan(); }
            
            const summonBtn = document.getElementById('btnSummon');
            summonBtn.disabled = false;
            summonBtn.classList.remove('opacity-40', 'cursor-not-allowed');
            summonBtn.classList.add('opacity-100', 'hover:-translate-y-1', 'hover:shadow-[0_0_25px_rgba(251,191,36,0.6)]');
            summonBtn.innerHTML = `<div class="text-sm opacity-80 mb-1">모든 준비가 끝났습니다</div><div class="text-2xl">운명과 시간이 만나는 순간</div>`;
        }

        function triggerFaceScan() { document.getElementById('faceInput').click(); }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if(!file) return;

            const imgURL = URL.createObjectURL(file);
            const img = new Image();
            img.src = imgURL;
            img.onload = async () => {
                let hasFace = false;

                if ('FaceDetector' in window) {
                    try {
                        const faceDetector = new FaceDetector();
                        const faces = await faceDetector.detect(img);
                        hasFace = faces.length > 0;
                    } catch (e) { console.error(e); }
                } else {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 100;
                    canvas.height = 100;
                    ctx.drawImage(img, 0, 0, 100, 100);
                    const data = ctx.getImageData(0, 0, 100, 100).data;
                    let skinPixels = 0;
                    for (let i = 0; i < data.length; i += 4) {
                        let r = data[i], g = data[i+1], b = data[i+2];
                        if (r > 95 && g > 40 && b > 20 && Math.max(r,g,b) - Math.min(r,g,b) > 15 && Math.abs(r-g) > 15 && r > g && r > b) {
                            skinPixels++;
                        }
                    }
                    hasFace = skinPixels > 300; 
                }

                if (!hasFace) {
                    alert("사진에 사람이 없습니다. 다시 확인해주세요.");
                    document.getElementById('faceInput').value = '';
                    return;
                }

                const modal = document.getElementById('scanModal');
                document.getElementById('scannedImage').src = imgURL;
                modal.classList.remove('hidden');
                
                setTimeout(() => {
                    document.getElementById('hanjaOverlay').classList.remove('hidden');
                    document.getElementById('hanjaOverlay').classList.add('flex');
                    document.getElementById('scanLog').innerText = "얼굴 관상 파악 완료! 음양오행 분석 중...";
                }, 1500);

                setTimeout(() => { 
                    modal.classList.add('hidden'); 
                    document.getElementById('hanjaOverlay').classList.add('hidden');
                    document.getElementById('hanjaOverlay').classList.remove('flex');
                    document.getElementById('scanLog').innerText = "얼굴 윤곽 분석 중...";
                    selectMode('face'); 
                    document.getElementById('faceInput').value = ''; 
                }, 4500);
            };
        }

        function generateUniqueFortuneText(angel) {
            const today = new Date().toISOString().slice(0, 10);
            const historyKey = 'fortuneHistory_' + today;
            let history = JSON.parse(localStorage.getItem(historyKey) || '[]');
            
            let text = '';
            let isUnique = false;
            let attempts = 0;
            
            while (!isUnique && attempts < 20) {
                let p = angel.pools;
                text = `${getRandomItem(p.intro)} ${getRandomItem(p.wealth)} ${getRandomItem(p.work)} ${getRandomItem(p.relation)} ${getRandomItem(p.health)} ${getRandomItem(p.outro)}`;
                let hash = text.split('').reduce((a,b)=>{a=((a<<5)-a)+b.charCodeAt(0);return a&a},0);
                
                if(!history.includes(hash)) {
                    isUnique = true;
                    history.push(hash);
                    localStorage.setItem(historyKey, JSON.stringify(history));
                }
                attempts++;
            }
            return text;
        }

        function startSummoning() {
            if(isSummoning || !selectedMode) return;
            isSummoning = true;
            hasAnimated = false;
            
            const night = document.getElementById('nightOverlay');
            const dawn = document.getElementById('dawnOverlay');
            night.style.opacity = '1';
            setTimeout(() => { dawn.style.opacity = '1'; }, 1000);
            document.getElementById('mainScreen').style.opacity = '0';

            const angel = getRandomItem(allAngels);
            currentAngelData = angel;
            
            // 점수 및 게이지 고정값 생성
            currentAngelData.targetGauge = Math.floor(Math.random() * 51) + 50;
            currentAngelData.targetScore = Math.floor(Math.random() * 30) + 70; // 70 ~ 99
            
            // 오행 코멘트(75종 풀) 중 무작위 1개 선택
            let h = angel.element.h;
            currentAngelData.elementMessage = getRandomItem(elementData[h].m);
            
            currentAngelData.generatedFortune = generateUniqueFortuneText(angel);

            setTimeout(() => {
                night.style.opacity = '0';
                dawn.style.opacity = '0';
                
                document.getElementById('mainScreen').classList.add('hidden');
                const resultScreen = document.getElementById('resultScreen');
                resultScreen.classList.remove('hidden');
                resultScreen.style.display = 'flex';
                resultScreen.scrollTop = 0;
                window.scrollTo(0, 0); 
                
                prepareResultUI(angel);
                setupLotto();

                setTimeout(() => {
                    document.getElementById('cardInner').classList.add('card-show');
                    setTimeout(() => {
                        document.getElementById('cardInner').classList.add('is-flipped');
                        initObserver(angel);
                    }, 800);
                }, 100);
            }, 3000);
        }

        function prepareResultUI(angel) {
            const theme = themes[angel.level];
            
            document.getElementById('cardFront').style.borderColor = theme.hex;
            document.getElementById('cardBack').style.borderColor = theme.hex;
            document.getElementById('loadingIcon').style.color = theme.hex;
            document.getElementById('loadingText').style.color = theme.hex;
            document.getElementById('quoteIcon').style.color = theme.hex;
            
            document.getElementById('rankBadge').innerText = theme.label;
            document.getElementById('rankBadge').style.background = `linear-gradient(to right, ${theme.gradStart}, ${theme.gradEnd})`;

            const imgEl = document.getElementById('cardImage');
            imgEl.src = `./images/${angel.image_filename}.png`;
            imgEl.onerror = function() {
                if (this.src.endsWith('.png')) {
                    this.src = `./images/${angel.image_filename}.jpg`;
                } else if (this.src.endsWith('.jpg')) {
                    this.src = `./images/${angel.image_filename}.jpeg`;
                } else {
                    this.src = 'https://images.unsplash.com/photo-1532012197267-da84d127e765?q=80&w=300&auto=format&fit=crop';
                    this.onerror = null;
                }
            };

            document.getElementById('cardName').innerText = angel.name;
            document.getElementById('fortuneMessage').innerHTML = angel.generatedFortune;
            
            let rColor = getRandomItem(pantoneColors);
            document.getElementById('luckyColorBox').style.backgroundColor = rColor.hex;
            document.getElementById('pantoneCode').innerText = rColor.code;
            document.getElementById('luckyColorName').innerText = rColor.name;
            
            document.getElementById('luckyDirection').innerText = getRandomItem(directions);
            
            document.getElementById('goodMateTitle').innerHTML = `<i class="fa-solid fa-user-check mr-1"></i> ${getRandomItem(goodMateTitles)}`;
            document.getElementById('badMateTitle').innerHTML = `<i class="fa-solid fa-user-xmark mr-1"></i> ${getRandomItem(badMateTitles)}`;
            
            let goodMbti = getRandomItem(mbtis);
            let goodBlood = getRandomItem(bloods);
            document.getElementById('luckyMate').innerHTML = `${goodMbti}<br>${goodBlood}`;
            
            let badMbti, badBlood;
            do { badMbti = getRandomItem(mbtis); } while(badMbti === goodMbti);
            do { badBlood = getRandomItem(bloods); } while(badBlood === goodBlood);
            document.getElementById('badMate').innerHTML = `${badMbti}<br>${badBlood}`;

            document.getElementById('yinYangHanja').innerText = angel.element.h;
            document.getElementById('yinYangHanja').style.color = angel.element.c;
            document.getElementById('actionMessage').innerText = currentAngelData.elementMessage;
        }

        function setupLotto() {
            const grid = document.getElementById('lottoGrid');
            grid.innerHTML = '';
            
            let nums = Array.from({length: 45}, (_, i) => i + 1);
            for(let i = nums.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [nums[i], nums[j]] = [nums[j], nums[i]];
            }
            let selectedNums = nums.slice(0, 6).sort((a, b) => a - b);
            
            selectedNums.forEach((num) => {
                let card = document.createElement('div');
                card.className = 'lotto-card';
                card.innerHTML = `
                    <div class="lotto-inner">
                        <div class="lotto-front">?</div>
                        <div class="lotto-back">${num}</div>
                    </div>
                `;
                card.onclick = function() {
                    this.classList.add('flipped');
                    document.getElementById('lottoHint').style.display = 'none';
                };
                grid.appendChild(card);
            });
        }

        function initObserver(angel) {
            const statsContainer = document.getElementById('statsContainer');
            const gaugeContainer = document.querySelector('.gauge-container');
            
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        statsContainer.classList.remove('opacity-0', 'translate-y-10');
                        statsContainer.classList.add('opacity-100', 'translate-y-0');
                        
                        runStatsAnimation(currentAngelData.targetScore);
                        runGaugeAnimation();
                        document.getElementById('yinYangHanja').classList.add('animate');
                    } else {
                        // 이탈 시 점수를 0으로 되돌려 재진입시 카운트업 애니메이션은 재생하되, 목표값은 유지
                        statsContainer.classList.remove('opacity-100', 'translate-y-0');
                        statsContainer.classList.add('opacity-0', 'translate-y-10');
                        document.getElementById('fortuneScore').innerText = '0';
                        document.getElementById('gaugeText').innerText = '0%';
                        document.getElementById('gaugePath').setAttribute('stroke-dasharray', '0, 100');
                        document.getElementById('yinYangHanja').classList.remove('animate');
                        clearInterval(scoreInterval);
                        clearInterval(gaugeInterval);
                    }
                });
            }, { threshold: 0.1 });
            
            observer.observe(statsContainer);
            observer.observe(gaugeContainer);
        }

        function runStatsAnimation(targetScore) {
            let currentScore = 0;
            const scoreEl = document.getElementById('fortuneScore');
            
            clearInterval(scoreInterval);
            scoreInterval = setInterval(() => {
                currentScore += 2;
                if(currentScore >= targetScore) {
                    currentScore = targetScore;
                    clearInterval(scoreInterval);
                }
                scoreEl.innerText = currentScore;
            }, 20);
        }

        function runGaugeAnimation() {
            let targetGauge = currentAngelData.targetGauge; 
            let current = 0;
            const textEl = document.getElementById('gaugeText');
            const pathEl = document.getElementById('gaugePath');
            
            const strokeColor = targetGauge > 80 ? '#22c55e' : (targetGauge > 60 ? '#eab308' : '#ef4444');
            pathEl.style.stroke = strokeColor;
            
            clearInterval(gaugeInterval);
            gaugeInterval = setInterval(() => {
                current += 2;
                if(current >= targetGauge) {
                    current = targetGauge;
                    clearInterval(gaugeInterval);
                }
                textEl.innerText = current + '%';
                pathEl.setAttribute('stroke-dasharray', `${current}, 100`);
            }, 30);
        }

        function shareFortune() {
            if(!currentAngelData) return;
            const gifts = ["행운", "사랑", "건강", "기운", "기세"];
            const randomGift = getRandomItem(gifts);
            const randomScore = Math.floor(Math.random() * 21) + 80; 
            const currentScore = document.getElementById('fortuneScore').innerText;
            
            const shareText = `나의 수호천사: ${currentAngelData.name}\n나의 행운 점수: ${currentScore}점\n\n당신에게 '${randomGift}'을(를) ${randomScore}점 선물합니다! \n\n나의 운세 확인하기 👉`;
            const shareUrl = window.location.href.split('?')[0]; 
            
            if (navigator.share) {
                navigator.share({
                    title: '길운이 드는 시간',
                    text: shareText,
                    url: shareUrl
                }).catch(console.error);
            } else {
                navigator.clipboard.writeText(`${shareText}\n${shareUrl}`)
                    .then(() => alert('공유하기 메시지가 클립보드에 복사되었습니다. 친구에게 붙여넣기 해보세요!'))
                    .catch(() => alert('공유하기를 지원하지 않는 브라우저입니다.'));
            }
        }
    </script>
