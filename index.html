<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>지금 이 순간 수호천사</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #0f172a; color: white; overflow-x: hidden; scroll-behavior: smooth; }
        
        /* 아날로그 시계 */
        .clock-face { width: 220px; height: 220px; border-radius: 50%; border: 6px solid #fbbf24; position: relative; background: radial-gradient(circle, #1e293b 0%, #0f172a 100%); box-shadow: 0 0 30px rgba(251, 191, 36, 0.3); margin: 0 auto; }
        .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom; background: white; border-radius: 4px; transform: translateX(-50%); transition: transform 0.05s cubic-bezier(0.4, 2.08, 0.55, 0.44); }
        .hour-hand { width: 4px; height: 55px; background: #cbd5e1; }
        .min-hand { width: 3px; height: 80px; background: #f8fafc; }
        .sec-hand { width: 2px; height: 95px; background: #ef4444; }
        .clock-center { position: absolute; top: 50%; left: 50%; width: 14px; height: 14px; background: #fbbf24; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        
        .mode-btn { transition: all 0.3s ease; }
        .mode-btn.active { border-color: #fbbf24; background-color: rgba(251, 191, 36, 0.1); box-shadow: 0 0 15px rgba(251, 191, 36, 0.4); transform: translateY(-2px); }

        /* 소환 이펙트: 안개 & 번개 & 화면 진동 */
        .screen-shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both infinite; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-3px, 0, 0) rotate(-1deg); }
            20%, 80% { transform: translate3d(5px, 0, 0) rotate(2deg); }
            30%, 50%, 70% { transform: translate3d(-10px, 0, 0) rotate(-2deg); }
            40%, 60% { transform: translate3d(10px, 0, 0) rotate(1deg); }
        }

        .lightning-overlay { position: fixed; inset: 0; background: #fff; z-index: 45; opacity: 0; pointer-events: none; mix-blend-mode: overlay; }
        .lightning-active { animation: lightningStrike 2.5s ease-out forwards; }
        @keyframes lightningStrike {
            0% { opacity: 0; } 5% { opacity: 1; } 10% { opacity: 0; } 15% { opacity: 0.8; } 25% { opacity: 0; } 
            60% { opacity: 0; } 65% { opacity: 0.9; } 70% { opacity: 0; } 100% { opacity: 0; }
        }

        .fog-overlay {
            position: fixed; inset: 0; z-index: 40; opacity: 0; pointer-events: none;
            background-image: radial-gradient(circle, rgba(255,255,255,0.4) 0%, transparent 60%);
            filter: blur(20px); transform: scale(1);
        }
        .fog-active { animation: fogSpreading 2.5s ease-in forwards; }
        @keyframes fogSpreading {
            0% { opacity: 0; transform: scale(1) translateY(100px); }
            50% { opacity: 0.8; transform: scale(1.5) translateY(0); }
            100% { opacity: 0; transform: scale(3) translateY(-100px); }
        }
        
        .swirl-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; z-index: 35;
            background: conic-gradient(from 0deg, #fbbf24, #ef4444, #8b5cf6, #3b82f6, #10b981, #fbbf24);
            mix-blend-mode: screen; transform: scale(0);
        }
        .swirl-active { opacity: 0.5; animation: swirlSpin 2.5s cubic-bezier(0.1, 0.7, 0.1, 1) forwards; }
        @keyframes swirlSpin { 0% { transform: rotate(0deg) scale(0); } 100% { transform: rotate(1080deg) scale(3); } }

        .white-flash { position: fixed; inset: 0; background: white; z-index: 60; opacity: 0; pointer-events: none; }
        .flash-active { animation: flashBang 1.5s ease-out forwards; }
        @keyframes flashBang { 0% { opacity: 1; } 100% { opacity: 0; } }

        /* 카드 애니메이션 */
        .perspective { perspective: 1500px; }
        .card-inner { position: relative; width: 100%; height: 100%; text-align: center; transform-style: preserve-3d; transition: transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform: scale(0.3) translateY(200px); opacity: 0; }
        .card-show { transform: scale(1) translateY(0); opacity: 1; }
        .card-inner.is-flipped { transform: scale(1) translateY(0) rotateY(180deg); }
        
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); border-width: 4px; border-style: solid;}
        .card-front { background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .card-back { transform: rotateY(180deg); background-color: #0f172a; overflow: hidden; }
        
        .bg-glow { position: absolute; width: 100%; height: 100%; background: radial-gradient(circle, rgba(251,191,36,0.15) 0%, rgba(0,0,0,0) 60%); top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: -1; }
        .star-item { transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    </style>
</head>
<body class="min-h-screen flex flex-col relative">

    <div id="lightningOverlay" class="lightning-overlay"></div>
    <div id="fogOverlay" class="fog-overlay"></div>
    <div id="swirlOverlay" class="swirl-overlay"></div>
    <div id="whiteFlash" class="white-flash"></div>
    
    <input type="file" id="faceInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">

    <!-- 1. 메인 화면 -->
    <div id="mainScreen" class="flex-1 flex flex-col items-center justify-center p-6 relative z-10 transition-opacity duration-500">
        <div class="bg-glow"></div>
        <h2 class="text-gray-400 text-sm mb-3 tracking-widest font-semibold">나의 수호천사가 알려주는</h2>
        <h1 class="text-5xl font-black text-white mb-12 text-center leading-tight drop-shadow-lg tracking-tight">
            지금 이 순간<br><span class="text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-600">내 운세</span>
        </h1>
        
        <div class="clock-face mb-8">
            <div id="hourHand" class="hand hour-hand"></div>
            <div id="minHand" class="hand min-hand"></div>
            <div id="secHand" class="hand sec-hand"></div>
            <div class="clock-center"></div>
        </div>

        <div id="digitalClock" class="text-3xl font-mono text-yellow-400 font-bold tracking-widest mb-12 drop-shadow-[0_0_10px_rgba(251,191,36,0.5)]">00:00:00:00</div>

        <div class="flex gap-4 mb-10 w-full max-w-sm">
            <button id="btnFortune" onclick="selectMode('fortune')" class="mode-btn flex-1 bg-gray-800/80 backdrop-blur text-gray-300 py-4 rounded-xl border-2 border-gray-700">
                <i class="fa-solid fa-star-and-crescent mb-2 text-xl block"></i>
                <span class="text-sm">지금 이 순간</span><br><span class="font-bold text-white text-lg">운세 알아보기</span>
            </button>
            <button id="btnFace" onclick="triggerFaceScan()" class="mode-btn flex-1 bg-gray-800/80 backdrop-blur text-gray-300 py-4 rounded-xl border-2 border-gray-700">
                <i class="fa-solid fa-camera mb-2 text-xl block"></i>
                <span class="text-sm">지금 이 순간</span><br><span class="font-bold text-white text-lg">관상 알아보기</span>
            </button>
        </div>

        <button id="btnSummon" onclick="startSummoning()" disabled class="w-full max-w-sm bg-gradient-to-r from-yellow-600 to-yellow-400 text-gray-900 font-black py-5 rounded-2xl shadow-[0_0_15px_rgba(251,191,36,0.2)] transition-all transform opacity-40 cursor-not-allowed">
            <div class="text-sm opacity-90 mb-1">모드를 먼저 선택해주세요</div>
            <div class="text-2xl animate-pulse">나의 수호천사 소환</div>
        </button>
    </div>

    <!-- 2. 결과 화면 -->
    <div id="resultScreen" class="hidden flex-1 flex-col items-center p-6 relative z-10 pb-20 overflow-y-auto">
        <div id="resultBgGlow" class="absolute top-0 left-0 w-full h-[600px] opacity-20 blur-3xl z-0 transition-colors duration-1000"></div>

        <div class="perspective w-72 h-[420px] mx-auto mt-4 mb-8 z-10">
            <div id="cardInner" class="card-inner">
                <div id="cardFront" class="card-front">
                    <i class="fa-solid fa-bolt text-5xl mb-4 animate-bounce" id="loadingIcon"></i>
                    <p id="loadingText" class="font-bold tracking-[0.3em] text-lg">SUMMONING</p>
                </div>
                <div id="cardBack" class="card-back group">
                    <img id="cardImage" src="" class="w-full h-full object-cover opacity-80 group-hover:scale-110 transition-transform duration-[2000ms]">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent"></div>
                    <div class="absolute bottom-6 left-0 w-full text-center px-4">
                        <span id="rankBadge" class="text-black text-xs font-black px-4 py-1.5 rounded-full mb-3 inline-block shadow-lg">등급</span>
                        <h3 id="cardName" class="text-4xl font-black text-white drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)] tracking-tight">이름</h3>
                    </div>
                </div>
            </div>
        </div>

        <div class="w-full max-w-md bg-gray-800/90 rounded-3xl p-7 border border-gray-700 backdrop-blur-md z-10 shadow-2xl relative">
            <div class="mb-8 relative">
                <i class="fa-solid fa-quote-left text-3xl opacity-20 absolute -top-3 -left-2" id="quoteIcon"></i>
                <p id="fortuneMessage" class="text-[16px] text-gray-100 leading-[1.8] break-keep relative z-10 pl-4 mt-2">
                    통합된 운세 메시지가 출력됩니다.
                </p>
            </div>

            <div id="statsContainer" class="bg-gray-900/80 rounded-2xl p-5 mb-6 border border-gray-700/50 transform transition-all duration-700 opacity-0 translate-y-10">
                <div class="flex justify-between items-end mb-4">
                    <div>
                        <span class="text-gray-400 text-xs font-bold tracking-widest block mb-1">천기 누설 점수</span>
                        <span id="fortuneScore" class="text-6xl font-black leading-none">0</span><span class="text-gray-500 font-bold ml-1">점</span>
                    </div>
                    <div class="text-right pb-1">
                        <span class="text-gray-400 text-xs font-bold tracking-widest block mb-2">기운의 크기</span>
                        <div id="starContainer" class="text-lg flex gap-1 justify-end flex-wrap w-32"></div>
                    </div>
                </div>
                <p id="actionMessage" class="text-[15px] font-bold text-white bg-black/60 p-4 rounded-xl break-keep text-center shadow-inner border border-gray-700">지령 메시지</p>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div id="luckyColorBox" class="p-4 rounded-2xl border border-gray-700 flex flex-col justify-between shadow-inner h-24">
                    <span class="text-xs font-bold text-white/80 drop-shadow-md"><i class="fa-solid fa-palette mr-1"></i> 행운의 컬러</span>
                    <strong id="luckyColor" class="text-white text-lg drop-shadow-md self-end">컬러</strong>
                </div>
                <div class="bg-gray-900 p-4 rounded-2xl border border-gray-700 flex items-center justify-between h-24 relative overflow-hidden">
                    <div class="z-10 flex flex-col h-full justify-between">
                        <span class="text-xs font-bold text-gray-400"><i class="fa-solid fa-utensils mr-1"></i> 추천 메뉴</span>
                        <strong id="luckyCafe" class="text-white text-sm font-bold mt-auto max-w-[80px] break-keep">메뉴</strong>
                    </div>
                    <img id="luckyCafeImg" src="" class="absolute -right-4 -bottom-4 w-24 h-24 object-cover rounded-full border-4 border-gray-800 shadow-xl opacity-90">
                </div>
                <div class="bg-gray-900 p-4 rounded-2xl border border-gray-700 h-24 flex flex-col justify-between">
                    <span class="text-xs font-bold text-gray-400"><i class="fa-solid fa-clover mr-1"></i> 행운의 숫자</span>
                    <strong id="luckyNum" class="text-3xl font-black self-end">000</strong>
                </div>
                <div class="bg-gray-900 p-4 rounded-2xl border border-gray-700 h-24 flex flex-col justify-between">
                    <span class="text-xs font-bold text-gray-400"><i class="fa-solid fa-user-group mr-1"></i> 지금 내 편</span>
                    <strong id="luckyMate" class="text-white text-base font-bold self-end text-right leading-tight">MBTI<br>혈액형</strong>
                </div>
            </div>
        </div>
        <button onclick="location.reload()" class="mt-10 mb-8 bg-gray-800 px-8 py-4 rounded-full text-gray-300 font-bold text-base border border-gray-700 hover:bg-gray-700 transition">다시 뽑기</button>
    </div>

    <!-- 관상 분석 모달 -->
    <div id="scanModal" class="hidden fixed inset-0 bg-black/95 z-50 flex flex-col items-center justify-center p-6">
        <h3 class="text-xl font-bold text-green-400 mb-8 tracking-widest animate-pulse">관상 및 기운 판독 시스템 가동</h3>
        <div class="relative w-72 h-72 border-2 border-green-500 rounded-2xl overflow-hidden shadow-[0_0_30px_rgba(34,197,94,0.3)]">
            <img id="scannedImage" class="w-full h-full object-cover opacity-60 grayscale brightness-110 contrast-125" />
            <div class="absolute inset-0 bg-gradient-to-b from-transparent via-green-400/50 to-transparent w-full h-8 scan-line"></div>
            <div class="absolute inset-0 border border-green-500/30 grid grid-cols-3 grid-rows-3 pointer-events-none">
                <div class="border-b border-r border-green-500/30"></div><div class="border-b border-r border-green-500/30"></div><div class="border-b border-green-500/30"></div>
                <div class="border-b border-r border-green-500/30"></div><div class="border-b border-r border-green-500/30"></div><div class="border-b border-green-500/30"></div>
                <div class="border-r border-green-500/30"></div><div class="border-r border-green-500/30"></div><div></div>
            </div>
        </div>
        <div id="scanLog" class="mt-8 text-green-400 font-mono text-sm h-16 text-center leading-relaxed">데이터 수집 중...</div>
    </div>

            { 
                level: 'normal', name: "박말래 할머니", imgFallbackUrl: "./images/박말래_할머니.png",
                message: "아이고 우리 강아지, 요새 혼자 속앓이 하느라 많이 힘들었재? 올해 묵은 때는 다 지나갔고 이제 좋은 일만 남았응게 밥이나 굶지 말고 든든하게 잘 챙겨 먹어. 밥심이 최고여. 직장이나 동료들한테 따뜻한 말 한마디 먼저 건네봐, 뜻밖의 호의가 큰 도움으로 돌아온당게. 당장 큰 돈이 쏟아지진 않아도, 지갑 비지 않게 쏠쏠하니 돈도 들어올 거여. 규칙적인 식사가 보약이니께 밀가루는 쫌 줄이고 든든한 한식을 챙겨 묵어, 알았재?",
                score: 65, stars: 5, actionMessage: "지금 당장 따뜻한 물 한 잔 마시고 뻐근한 목을 주물러라.",
                color: { name: "스카이 블루", hex: "#3b82f6" }, cafe: { name: "쌍화차", img: "https://images.unsplash.com/photo-1595981267035-7b04d84b4f5c?w=200&q=80" }, mate: "ISFJ / A형" 
            }
        ];

        function updateClock() {
            if(isSummoning) return;
            const now = new Date();
            const hrDeg = (now.getHours() % 12) * 30 + (now.getMinutes() / 2) - 50; 
            const minDeg = now.getMinutes() * 6 + (now.getSeconds() / 10) - 50;
            const secDeg = now.getSeconds() * 6 + (now.getMilliseconds() * 0.006) - 50;
            document.getElementById('hourHand').style.transform = `translateX(-50%) rotate(${hrDeg}deg)`;
            document.getElementById('minHand').style.transform = `translateX(-50%) rotate(${minDeg}deg)`;
            document.getElementById('secHand').style.transform = `translateX(-50%) rotate(${secDeg}deg)`;
            
            const msStr = String(now.getMilliseconds()).padStart(3, '0').substring(0, 2);
            document.getElementById('digitalClock').innerText = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}:${msStr}`;
            requestAnimationFrame(updateClock);
        }
        requestAnimationFrame(updateClock);

        function selectMode(mode) {
            selectedMode = mode;
            document.getElementById('btnFortune').classList.remove('active');
            document.getElementById('btnFace').classList.remove('active');
            if(mode === 'fortune') document.getElementById('btnFortune').classList.add('active');
            if(mode === 'face') { document.getElementById('btnFace').classList.add('active'); triggerFaceScan(); }
            
            const summonBtn = document.getElementById('btnSummon');
            summonBtn.disabled = false;
            summonBtn.classList.remove('opacity-40', 'cursor-not-allowed');
            summonBtn.classList.add('opacity-100', 'hover:-translate-y-1', 'hover:shadow-[0_0_25px_rgba(251,191,36,0.6)]');
            summonBtn.innerHTML = `<div class="text-sm opacity-80 mb-1">모든 준비가 끝났습니다</div><div class="text-2xl">와주세요 나의 수호천사</div>`;
        }

        function triggerFaceScan() { document.getElementById('faceInput').click(); }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const modal = document.getElementById('scanModal');
                document.getElementById('scannedImage').src = e.target.result;
                modal.classList.remove('hidden');
                
                const logs = ["얼굴 윤곽 분석 중...", "이목구비 비율 계산 중...", "관상학적 음양오행 데이터 추출...", "배경 기운 및 오라(Aura) 판독...", "최적의 수호천사 매칭 중..."];
                let step = 0;
                document.getElementById('scanLog').innerText = logs[step];
                const interval = setInterval(() => { step++; if(step < logs.length) document.getElementById('scanLog').innerText = logs[step]; }, 1000);
                setTimeout(() => { clearInterval(interval); modal.classList.add('hidden'); selectMode('face'); document.getElementById('faceInput').value = ''; }, 5000);
            };
            reader.readAsDataURL(file);
        }

        function startSummoning() {
            if(isSummoning || !selectedMode) return;
            isSummoning = true;
            
            document.body.classList.add('screen-shake');
            document.getElementById('lightningOverlay').classList.add('lightning-active');
            document.getElementById('fogOverlay').classList.add('fog-active');
            document.getElementById('swirlOverlay').classList.add('swirl-active');
            
            document.getElementById('secHand').style.animation = 'swirlSpin 0.5s linear infinite';
            document.getElementById('minHand').style.animation = 'swirlSpin 1s linear infinite reverse';
            document.getElementById('mainScreen').style.opacity = '0';

            const angel = allAngels[Math.floor(Math.random() * allAngels.length)];

            setTimeout(() => {
                document.getElementById('whiteFlash').classList.add('flash-active');
                document.body.classList.remove('screen-shake');
                document.getElementById('lightningOverlay').style.display = 'none';
                document.getElementById('fogOverlay').style.display = 'none';
                document.getElementById('swirlOverlay').style.display = 'none';
                
                document.getElementById('mainScreen').classList.add('hidden');
                document.getElementById('resultScreen').classList.remove('hidden');
                document.getElementById('resultScreen').style.display = 'flex';
                
                prepareResultUI(angel);

                setTimeout(() => {
                    document.getElementById('cardInner').classList.add('card-show');
                    setTimeout(() => {
                        document.getElementById('cardInner').classList.add('is-flipped');
                        initObserver(angel);
                    }, 800);
                }, 100);
            }, 2800);
        }

        function prepareResultUI(angel) {
            const theme = themes[angel.level];
            
            document.getElementById('cardFront').style.borderColor = theme.hex;
            document.getElementById('cardBack').style.borderColor = theme.hex;
            document.getElementById('loadingIcon').style.color = theme.hex;
            document.getElementById('loadingText').style.color = theme.hex;
            document.getElementById('luckyNum').style.color = theme.hex;
            document.getElementById('quoteIcon').style.color = theme.hex;
            
            document.getElementById('rankBadge').innerText = theme.label;
            document.getElementById('rankBadge').style.background = `linear-gradient(to right, ${theme.gradStart}, ${theme.gradEnd})`;
            document.getElementById('resultBgGlow').style.backgroundColor = theme.hex;
            document.getElementById('luckyColorBox').style.backgroundColor = theme.hex;
            document.getElementById('fortuneScore').style.color = theme.hex;

            document.getElementById('cardImage').src = angel.imgFallbackUrl;
            document.getElementById('cardName').innerText = angel.name;
            document.getElementById('fortuneMessage').innerHTML = angel.message;
            document.getElementById('actionMessage').innerText = angel.actionMessage;
            
            document.getElementById('luckyColor').innerText = angel.color.name;
            document.getElementById('luckyCafe').innerText = angel.cafe.name;
            document.getElementById('luckyCafeImg').src = angel.cafe.img;
            document.getElementById('luckyNum').innerText = Math.floor(Math.random() * 900) + 100;
            document.getElementById('luckyMate').innerHTML = angel.mate.replace(' / ', '<br>');
        }

        function initObserver(angel) {
            const statsContainer = document.getElementById('statsContainer');
            const observer = new IntersectionObserver((entries, obs) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        statsContainer.classList.remove('opacity-0', 'translate-y-10');
                        statsContainer.classList.add('opacity-100', 'translate-y-0');
                        runStatsAnimation(angel);
                        obs.disconnect();
                    }
                });
            }, { threshold: 0.3 });
            observer.observe(statsContainer);
        }

        function runStatsAnimation(angel) {
            const theme = themes[angel.level];
            let currentScore = 0;
            const scoreEl = document.getElementById('fortuneScore');
            
            const scoreInterval = setInterval(() => {
                currentScore += 3;
                if(currentScore >= angel.score) {
                    currentScore = angel.score;
                    clearInterval(scoreInterval);
                }
                scoreEl.innerText = currentScore;
            }, 30);

            const starContainer = document.getElementById('starContainer');
            starContainer.innerHTML = '';
            for(let i=0; i<10; i++) {
                const star = document.createElement('i');
                if(i < angel.stars) {
                    star.className = `star-item opacity-0 scale-0 fa-solid fa-star drop-shadow-md text-2xl`;
                    star.style.color = theme.hex;
                } else {
                    star.className = `star-item opacity-0 scale-0 fa-regular fa-star text-gray-600 text-2xl`;
                }
                starContainer.appendChild(star);
                
                setTimeout(() => {
                    star.classList.remove('opacity-0', 'scale-0');
                    star.classList.add('opacity-100', 'scale-100');
                }, 150 * (i + 1));
            }
        }
    </script>
</body>
